<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw Pen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=JetBrains+Mono:wght@500&family=Saira:wght@800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The drawing: behind everything, the whole page -->
  <canvas class="pad" id="pad" aria-hidden="true"></canvas>
  <i class="tip" id="tip" aria-hidden="true"></i>

  <!-- The page. Its words and buttons sit on top: they can't be drawn on, and lines go behind them. -->
  <main class="content">
    <p class="label">Draw pen</p>
    <h1 id="title">Scribble all over it.<br>I love GSAP.</h1>
    <p class="lead">Draw anywhere on the page with the mouse, a finger or a pen. Your lines go behind the words and buttons, and the buttons still work.</p>
    <div class="tools" role="group" aria-label="Pen colour">
      <button class="swatch swatch--rainbow" type="button" data-ink="rainbow" aria-pressed="true" aria-label="Rainbow"></button>
      <button class="swatch" type="button" data-ink="#13111a" aria-pressed="false" aria-label="Ink" style="--ink: #13111a"></button>
      <button class="swatch" type="button" data-ink="#e0206a" aria-pressed="false" aria-label="Pink" style="--ink: #e0206a"></button>
      <button class="swatch" type="button" data-ink="#2b4bff" aria-pressed="false" aria-label="Blue" style="--ink: #2b4bff"></button>
      <button class="swatch" type="button" data-ink="#00967f" aria-pressed="false" aria-label="Mint" style="--ink: #00967f"></button>
      <button class="clear" id="clear" type="button">Clear</button>
    </div>
  </main>

  <!-- 1. GSAP from the CDN  2. your widget script -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
